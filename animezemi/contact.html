<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>東大アニメゼミ | 問い合わせ</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&family=Poppins:wght@600&display=swap" rel="stylesheet">

  <style>
    body { font-family: 'Noto Sans JP', sans-serif; background: linear-gradient(to bottom right, #7DD3FC, #F9A8D4); color: #fff; min-height: 100vh; }
    header { font-family: 'Poppins', sans-serif; }
    .fade-in { opacity: 0; }
  </style>
</head>

<body class="flex flex-col min-h-screen">
    <!-- ===== ヘッダー ===== -->
  <header class="bg-gradient-to-r from-sky-400 to-pink-400 text-white py-4 shadow-md">
    <div class="container mx-auto px-4 flex justify-between items-center">
      <h1 class="text-2xl font-bold">東大アニメゼミ</h1>
      <nav class="space-x-4">
        <a href="../index.html" class="hover:underline font-semibold">ZEMI / STUDIO ホーム</a>
        <a href="events.html" class="hover:underline">活動紹介</a>
        <a href="contact.html" class="hover:underline">問い合わせ</a>
      </nav>
    </div>
  </header>
  <!-- ヘッダー（そのまま） -->
  <header class="text-center py-12 fade-in">
    <h1 class="text-4xl md:text-5xl font-bold mb-2">問い合わせ</h1>
    <p class="text-white/90 text-lg">ゼミ参加や質問はこちらから</p>
  </header>

  <!-- ===== メール・マシュマロに変更した部分 ===== -->
  <main class="flex-grow container mx-auto px-6 py-10 fade-in">
    <div class="max-w-3xl mx-auto bg-white/20 backdrop-blur-md rounded-2xl p-6 space-y-8">

      <!-- メール -->
      <div class="p-5 bg-white/30 backdrop-blur-md rounded-xl shadow-md">
        <h2 class="text-2xl font-bold mb-2">📧 メールで問い合わせ</h2>
        <p class="text-white/90 mb-3">ゼミや活動への質問はこちらへどうぞ。</p>

        <a href="mailto:anime.todai@gmail.com"
           class="inline-block bg-white text-pink-600 font-bold px-6 py-3 rounded-full hover:bg-pink-50 transition">
          anime.todai@gmail.com
        </a>
      </div>

      <!-- マシュマロ -->
      <div class="p-5 bg-white/30 backdrop-blur-md rounded-xl shadow-md">
        <h2 class="text-2xl font-bold mb-2">🍡 マシュマロで質問</h2>
        <p class="text-white/90 mb-3">匿名で気軽に質問したい場合はこちら。</p>

        <a href="https://marshmallow-qa.com/jebewd1w2t07pmz?t=dKmlqL&utm_medium=url_text&utm_source=promotion"
           target="_blank"
           class="inline-block bg-white text-sky-600 font-bold px-6 py-3 rounded-full hover:bg-sky-50 transition">
          マシュマロへ投稿する
        </a>
      </div>

    </div>
  </main>

  <!-- フッター（そのまま） -->
  <footer class="text-center py-8 text-white/80 fade-in">
    <a href="index.html" class="bg-white text-sky-500 font-bold px-6 py-2 rounded-full hover:bg-sky-100 transition">ゼミトップへ</a>
    <p class="mt-4">© 東大アニメゼミ</p>
  </footer>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      anime({
        targets: '.fade-in',
        opacity: [0,1],
        translateY: [20,0],
        delay: anime.stagger(200),
        duration: 1000,
        easing: 'easeOutQuad'
      });
    });
  </script>
</body>
</html>
